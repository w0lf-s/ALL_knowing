<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL Knowing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
        nav { background: #1a1a2e; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; border-bottom: 1px solid #2a2a4a; }
        nav .brand { font-size: 1.4rem; font-weight: 700; color: #7c3aed; }
        nav a { color: #a0a0a0; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; transition: all 0.2s; }
        nav a:hover, nav a.active { color: #fff; background: #2a2a4a; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        .search-box { background: #1a1a2e; border-radius: 12px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #2a2a4a; }
        .search-box h2 { margin-bottom: 1rem; color: #c4b5fd; font-size: 1.2rem; }
        .search-box form { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
        .search-box .form-row { display: flex; gap: 0.75rem; width: 100%; }
        .search-box .form-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .search-box button.secondary { background: #2a2a4a; }
        .search-box button.secondary:hover { background: #3a3a5a; }
        .search-box label.check { display: flex; align-items: center; gap: 0.5rem; color: #a0a0a0; font-size: 0.9rem; }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.8rem; background: #2a2a4a; color: #c4b5fd; }
        .badge.yes { background: #14532d; color: #86efac; }
        .badge.no { background: #3b1111; color: #fca5a5; }
        .search-box input[type="text"] { flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #3a3a5a; background: #0f0f0f; color: #e0e0e0; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .search-box input[type="text"]:focus { border-color: #7c3aed; }
        .search-box button { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #7c3aed; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .search-box button:hover { background: #6d28d9; }
        .error { background: #3b1111; border: 1px solid #7f1d1d; color: #fca5a5; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #2a2a4a; }
        .card h3 { color: #c4b5fd; margin-bottom: 1rem; font-size: 1.1rem; }
        table { width: 100%; border-collapse: collapse; }
        table th, table td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #2a2a4a; }
        table th { color: #a78bfa; font-weight: 600; width: 35%; }
        table td { color: #d4d4d4; word-break: break-word; }
        .news-item { padding: 1rem 0; border-bottom: 1px solid #2a2a4a; }
        .news-item:last-child { border-bottom: none; }
        .news-item h4 { color: #e0e0e0; margin-bottom: 0.3rem; }
        .news-item h4 a { color: #a78bfa; text-decoration: none; }
        .news-item h4 a:hover { text-decoration: underline; }
        .news-item .meta { font-size: 0.85rem; color: #888; }
        .news-item p { margin-top: 0.5rem; color: #b0b0b0; font-size: 0.9rem; }
        .loading { display: none; align-items: center; gap: 0.5rem; color: #a78bfa; }
        .loading.show { display: flex; }
        .spinner { width: 18px; height: 18px; border: 2px solid #7c3aed; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav>
        <span class="brand">ALL Knowing</span>
        <a href="/lead" class="{% if active == 'lead' %}active{% endif %}">Lead</a>
        <a href="/company" class="{% if active == 'company' %}active{% endif %}">Company Search</a>
        <a href="/linkedin" class="{% if active == 'linkedin' %}active{% endif %}">LinkedIn Lookup</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => {
                const submitter = e.submitter;
                const btns = form.querySelectorAll('button');
                const loading = form.parentElement.querySelector('.loading');
                btns.forEach(btn => {
                    btn.disabled = true;
                    if (submitter && btn === submitter) {
                        btn.textContent = btn.dataset.busy || 'Working...';
                    }
                });
                if (loading) loading.classList.add('show');
            });
        });
    </script>
</body>
</html>
